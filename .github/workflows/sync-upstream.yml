name: Sync and Merge Upstream

on:
  schedule:
    - cron: '30 1 * * *'   # 每天北京时间 09:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync main and merge into custom
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chikacya/anywhere-rules.git
          git fetch upstream main

          # 1. main 与上游保持一致
          git push origin refs/remotes/upstream/main:refs/heads/main --force

          # 2. 有新提交才合并
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "custom 已包含上游最新改动，无需合并"
            exit 0
          fi

          # 3. 合并，冲突时给出明确提示
          if ! git merge upstream/main --no-edit -m "chore: merge upstream main into custom"; then
            echo "::error::合并上游时发生冲突，请手动解决 custom 分支"
            git merge --abort
            exit 1
          fi

          git push origin custom
