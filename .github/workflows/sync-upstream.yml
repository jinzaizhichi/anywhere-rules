name: Sync Upstream Main

on:
  schedule:
    - cron: '30 1 * * *' # 每天北京时间 09:30 自动同步
  workflow_dispatch:     # 支持在网页端手动点击触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream/main to origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chikacya/anywhere-rules.git
          git fetch upstream main
          git push origin refs/remotes/upstream/main:refs/heads/main --force
