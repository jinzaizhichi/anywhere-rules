name: Sync and Merge Upstream

on:
  schedule:
    - cron: '30 1 * * *' # 每天北京时间 09:30 自动运行
  workflow_dispatch:     # 支持在 GitHub 网页端手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Sync main and merge into custom
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chikacya/anywhere-rules.git
          git fetch upstream main
          
          # 1. 让你的 main 分支保持与上游 100% 一致
          git push origin refs/remotes/upstream/main:refs/heads/main --force
          
          # 2. 将上游 main 的最新改动自动合并到你的 custom 分支
          git merge upstream/main --no-edit -m "chore: merge upstream main into custom"
          git push origin custom
